# Release builds. On a version tag (v1.2.3) — or by hand — build the installers on Linux, macOS and
# Windows and upload them, with the latest*.yml files the app's updater reads, to a DRAFT GitHub
# release of the public repository. A person checks the draft and publishes it; until then no
# installed app sees it. Signing and notarization run when their secrets exist; without them the
# builds are unsigned. The process: _docs/release.md (internal).
name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # releases are published from the public repository only (the token can't write elsewhere)
    if: github.repository == 'PixiLab-ai/nem-agent-public'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6   # the version comes from package.json's packageManager

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v7
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum

      - run: pnpm install --frozen-lockfile

      - name: The tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "apps/desktop/package.json says $v, the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: nemd's tests
        working-directory: daemon
        run: go test ./...

      - name: Type-check
        run: pnpm typecheck

      - name: Build and upload to the draft release
        working-directory: apps/desktop
        run: node scripts/dist.mjs ${{ matrix.target }} --publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS: Developer ID certificate (base64 .p12) and notarization — optional for now
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # no certificate: don't go looking for one in the runner's keychain
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
          # Windows: code-signing certificate (base64 .pfx) — optional for now
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
